name: CI Quality Gate & Security Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend:.
      APP_ENV: testing
      DRY_RUN: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment Diagnostics
        run: |
          echo "Operating System: $(uname -a)"
          echo "Python: $(python --version)"
          echo "Pip: $(pip --version)"
          echo "Working Directory: $(pwd)"
          echo "Git Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 1. Test Set Hash Immutability Gate
        run: python scripts/verify_test_set.py

      - name: 2. Automated Backend Pytest Suite
        run: pytest -q

      - name: 3. Reproducible Final Evaluation Benchmark
        run: python scripts/run_final_evaluation.py

      - name: 4. Release Guard Enforcement
        run: python scripts/release_guard.py

      - name: 5. Cloudflare Security Telemetry Gate
        run: python scripts/verify_cloudflare_security.py

      - name: 6. Data Security & DLP Verification Gate
        run: python scripts/verify_data_security.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 7. Frontend Production Bundle Build
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 8. Docker Multi-Stage Image Build
        run: docker build -t razorpay-ai-risk-manager .
